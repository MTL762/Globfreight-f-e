<svg width="960" height="1200" viewBox="0 0 960 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#023d47"/> <!-- navy -->
      <stop offset="50%" stop-color="#046777"/> <!-- teal -->
      <stop offset="100%" stop-color="#023d47"/> <!-- navy -->
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D10278"/> <!-- fuchsia -->
      <stop offset="100%" stop-color="#FFD700"/> <!-- accent -->
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 340) rotate(90) scale(400)">
      <stop stop-color="#046777" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#046777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 840) rotate(90) scale(350)">
      <stop stop-color="#D10278" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#D10278" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="1200" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <path d="M120 220L840 220" />
    <path d="M120 480L840 480" />
    <path d="M120 740L840 740" />
    <path d="M120 1000L840 1000" />
    <path d="M200 140L200 1100" />
    <path d="M480 140L480 1100" />
    <path d="M760 140L760 1100" />
  </g>

  <!-- Glowing Areas -->
  <circle cx="480" cy="340" r="400" fill="url(#glow1)"/>
  <circle cx="480" cy="840" r="350" fill="url(#glow2)"/>

  <!-- Abstract Network / Org Chart -->
  <!-- Connecting lines -->
  <path d="M480 340 L480 540" stroke="url(#lineGrad)" stroke-width="8" stroke-dasharray="8 8"/>
  <path d="M280 740 L480 540 L680 740" stroke="url(#lineGrad)" stroke-width="8"/>
  <path d="M280 740 L180 940" stroke="url(#lineGrad)" stroke-width="6" stroke-dasharray="6 6"/>
  <path d="M280 740 L380 940" stroke="url(#lineGrad)" stroke-width="6"/>
  <path d="M680 740 L580 940" stroke="url(#lineGrad)" stroke-width="6"/>
  <path d="M680 740 L780 940" stroke="url(#lineGrad)" stroke-width="6" stroke-dasharray="6 6"/>
  
  <!-- Nodes -->
  <!-- CEO / Top Node -->
  <g transform="translate(480, 340)">
    <circle r="70" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFD700" stroke-width="4"/>
    <circle r="50" fill="#FFD700"/>
    <!-- Abstract Icon -->
    <rect x="-24" y="-12" width="48" height="24" rx="4" fill="#023d47"/>
    <circle cx="0" cy="-18" r="14" fill="#023d47"/>
  </g>
  
  <!-- Central Label Box -->
  <rect x="360" y="516" width="240" height="48" rx="24" fill="#023d47" stroke="#046777" stroke-width="2"/>
  <text x="480" y="546" font-family="Inter, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">HR Management</text>

  <!-- Department Managers -->
  <g transform="translate(280, 740)">
    <circle r="55" fill="#FFFFFF" fill-opacity="0.1" stroke="#D10278" stroke-width="3"/>
    <circle r="40" fill="#D10278"/>
    <rect x="-18" y="-9" width="36" height="18" rx="3" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="11" fill="#FFFFFF"/>
  </g>
  <text x="280" y="820" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Recruitment</text>

  <g transform="translate(680, 740)">
    <circle r="55" fill="#FFFFFF" fill-opacity="0.1" stroke="#D10278" stroke-width="3"/>
    <circle r="40" fill="#D10278"/>
    <rect x="-18" y="-9" width="36" height="18" rx="3" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="11" fill="#FFFFFF"/>
  </g>
  <text x="680" y="820" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="middle">Operations</text>
  
  <!-- Employees -->
  <g transform="translate(180, 940)">
    <circle r="36" fill="#046777"/>
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="-10" r="8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(380, 940)">
    <circle r="36" fill="#046777"/>
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="-10" r="8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(580, 940)">
    <circle r="36" fill="#046777"/>
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="-10" r="8" fill="#FFFFFF"/>
  </g>
  <g transform="translate(780, 940)">
    <circle r="36" fill="#046777"/>
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="-10" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Abstract Stat Cards floating -->
  <g transform="translate(140, 160)">
    <rect width="220" height="110" rx="20" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="24" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Total Workforce</text>
    <text x="24" y="86" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#FFD700">1,248</text>
  </g>
  
  <g transform="translate(620, 200)">
    <rect width="220" height="160" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
    <text x="24" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Performance</text>
    <!-- Simple Bar Chart -->
    <rect x="24" y="70" width="30" height="70" rx="8" fill="#046777"/>
    <rect x="74" y="90" width="30" height="50" rx="8" fill="#D10278"/>
    <rect x="124" y="50" width="30" height="90" rx="8" fill="#FFD700"/>
    <rect x="174" y="80" width="30" height="60" rx="8" fill="#046777"/>
  </g>
</svg>
