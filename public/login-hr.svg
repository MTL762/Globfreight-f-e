<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001738" />
      <stop offset="50%" stop-color="#002E62" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <radialGradient id="orange-glow" cx="85%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#FE6F00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FE6F00" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="15%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="glass-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="orange-pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FE6F00" />
      <stop offset="100%" stop-color="#FF9343" />
    </linearGradient>

    <linearGradient id="chart-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#FE6F00" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="chart-area-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FE6F00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FE6F00" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FE6F00" flood-opacity="0.35" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="900" fill="url(#bg-grad)" />
  <rect width="800" height="900" fill="url(#orange-glow)" />
  <rect width="800" height="900" fill="url(#cyan-glow)" />
  <rect width="800" height="900" fill="url(#grid-dots)" />

  <!-- Ambient Geometric Tech Elements -->
  <g opacity="0.25">
    <circle cx="640" cy="180" r="160" stroke="#FE6F00" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="640" cy="180" r="220" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="160" cy="720" r="140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="5 5" />
  </g>

  <!-- Floating Brand Badge (Top Left) -->
  <g transform="translate(60, 60)">
    <rect width="210" height="42" rx="21" fill="url(#glass-card-bg)" stroke="url(#glass-border)" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#FE6F00" />
    <circle cx="24" cy="21" r="9" stroke="#FE6F00" stroke-width="1.5" opacity="0.6" />
    <text x="42" y="26" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">GLOBFREIGHT HR HUB</text>
  </g>

  <!-- MAIN DASHBOARD WINDOW CARD -->
  <g transform="translate(70, 150)" filter="url(#shadow-card)">
    <!-- Glass Backdrop -->
    <rect width="660" height="460" rx="24" fill="url(#glass-card-bg)" stroke="url(#glass-border)" stroke-width="1.5" />

    <!-- Window Header / Controls -->
    <g transform="translate(24, 24)">
      <circle cx="8" cy="8" r="6" fill="#ef4444" opacity="0.85" />
      <circle cx="28" cy="8" r="6" fill="#f59e0b" opacity="0.85" />
      <circle cx="48" cy="8" r="6" fill="#10b981" opacity="0.85" />

      <!-- Tab Pill -->
      <rect x="90" y="-3" width="160" height="24" rx="12" fill="#ffffff" fill-opacity="0.1" />
      <text x="110" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Live Team Analytics</text>

      <rect x="520" y="-3" width="90" height="24" rx="12" fill="#FE6F00" fill-opacity="0.2" stroke="#FE6F00" stroke-width="1" />
      <text x="536" y="13" fill="#FF9343" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">● 99.4% Sync</text>
    </g>

    <!-- Card Internal Divider -->
    <line x1="24" y1="62" x2="636" y2="62" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

    <!-- Metric Stat Cards Row -->
    <g transform="translate(28, 84)">
      <!-- Metric 1: Total Employees -->
      <g>
        <rect width="186" height="92" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Total Workforce</text>
        <text x="18" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">1,482</text>
        <rect x="114" y="44" width="56" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
        <text x="123" y="58" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">+12%</text>
      </g>

      <!-- Metric 2: Attendance Rate -->
      <g transform="translate(206, 0)">
        <rect width="186" height="92" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Attendance Today</text>
        <text x="18" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">98.6%</text>
        <rect x="114" y="44" width="56" height="20" rx="10" fill="#FE6F00" fill-opacity="0.25" />
        <text x="122" y="58" fill="#FE6F00" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Optimal</text>
      </g>

      <!-- Metric 3: Operations Flow -->
      <g transform="translate(412, 0)">
        <rect width="186" height="92" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
        <text x="18" y="30" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Active Shifts</text>
        <text x="18" y="62" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">24 / 24</text>
        <circle cx="152" cy="54" r="5" fill="#38bdf8" />
        <circle cx="152" cy="54" r="9" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
      </g>
    </g>

    <!-- Mini Chart Area -->
    <g transform="translate(28, 196)">
      <rect width="604" height="236" rx="16" fill="#000000" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <!-- Chart Header -->
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Employee Engagement &amp; Operational Efficiency</text>
      <text x="20" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Real-time attendance &amp; task velocity by department</text>

      <!-- Legend -->
      <g transform="translate(430, 20)">
        <circle cx="10" cy="10" r="4" fill="#FE6F00" />
        <text x="22" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Operations</text>
        <circle cx="100" cy="10" r="4" fill="#38bdf8" />
        <text x="112" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Logistics</text>
      </g>

      <!-- Chart Grid Lines -->
      <line x1="20" y1="80" x2="584" y2="80" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <line x1="20" y1="120" x2="584" y2="120" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <line x1="20" y1="160" x2="584" y2="160" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
      <line x1="20" y1="200" x2="584" y2="200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

      <!-- Chart Waves -->
      <!-- Gradient Fill Path -->
      <path d="M 30 180 Q 90 140, 150 150 T 270 120 T 390 135 T 510 90 T 575 75 L 575 200 L 30 200 Z" fill="url(#chart-area-grad)" />
      
      <!-- Primary Orange Line -->
      <path d="M 30 180 Q 90 140, 150 150 T 270 120 T 390 135 T 510 90 T 575 75" fill="none" stroke="url(#chart-line-grad)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Secondary Sky Line -->
      <path d="M 30 190 Q 90 165, 150 170 T 270 155 T 390 145 T 510 130 T 575 110" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="3 3" />

      <!-- Glowing High-point Marker -->
      <circle cx="510" cy="90" r="6" fill="#FE6F00" stroke="#ffffff" stroke-width="2.5" />
      <circle cx="510" cy="90" r="14" stroke="#FE6F00" stroke-width="1.5" opacity="0.6" />

      <g transform="translate(470, 48)">
        <rect width="80" height="26" rx="6" fill="#0f172a" stroke="#FE6F00" stroke-width="1" />
        <text x="14" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Peak: +28%</text>
      </g>
    </g>
  </g>

  <!-- FLOATING CARD: Team Presence & Approvals (Bottom Overlapping) -->
  <g transform="translate(420, 560)" filter="url(#shadow-card)">
    <rect width="320" height="110" rx="20" fill="#001838" fill-opacity="0.9" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- User Avatars Stack -->
    <g transform="translate(20, 24)">
      <circle cx="16" cy="16" r="16" fill="#FE6F00" />
      <text x="11" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">JD</text>

      <circle cx="42" cy="16" r="16" fill="#0284c7" />
      <text x="37" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">SA</text>

      <circle cx="68" cy="16" r="16" fill="#10b981" />
      <text x="63" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">MR</text>

      <circle cx="94" cy="16" r="16" fill="#6366f1" />
      <text x="84" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">+42</text>
    </g>

    <text x="134" y="38" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Payroll Batch Verified</text>
    <text x="134" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Automated dispatch executed</text>

    <!-- Verified Pill -->
    <g transform="translate(20, 72)">
      <rect width="280" height="24" rx="6" fill="#10b981" fill-opacity="0.15" />
      <path d="M 12 12 L 15 15 L 22 8" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="16" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">All 142 branch shifts synced flawlessly</text>
    </g>
  </g>

  <!-- FLOATING CARD: Instant Notifications (Top Left Overlapping) -->
  <g transform="translate(40, 480)" filter="url(#shadow-card)">
    <rect width="260" height="90" rx="18" fill="#001838" fill-opacity="0.9" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <g transform="translate(18, 18)">
      <rect width="36" height="36" rx="10" fill="url(#orange-pill)" />
      <!-- Star/Sparkle Icon -->
      <path d="M 18 10 L 20 15 L 25 18 L 20 21 L 18 26 L 16 21 L 11 18 L 16 15 Z" fill="#ffffff" />
      
      <text x="48" y="16" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Instant HR Insights</text>
      <text x="48" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Zero manual calculations</text>
    </g>

    <text x="18" y="74" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">● Smart attendance active</text>
  </g>

  <!-- BOTTOM CARD: Value Proposition Container -->
  <g transform="translate(70, 700)" filter="url(#shadow-card)">
    <rect width="660" height="150" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="url(#glass-border)" stroke-width="1.5" />
    
    <!-- Left Icon / Badge -->
    <g transform="translate(24, 28)">
      <rect width="48" height="48" rx="14" fill="url(#orange-pill)" filter="url(#shadow-glow)" />
      <!-- Globe with Arrow (matching logo concept) -->
      <circle cx="24" cy="24" r="14" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" />
      <line x1="10" y1="24" x2="38" y2="24" stroke="#ffffff" stroke-width="2" />
      <ellipse cx="24" cy="24" rx="7" ry="14" stroke="#ffffff" stroke-width="2" fill="none" />
    </g>

    <g transform="translate(90, 36)">
      <text x="0" y="18" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">Modern HR workspace with instant employee insights</text>
      <text x="0" y="44" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400">Manage, monitor, and empower your team from one clean dashboard</text>
    </g>

    <!-- Bottom Feature Chips -->
    <g transform="translate(90, 104)">
      <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" />
      <text x="12" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">✓ Real-time Attendance</text>

      <rect x="142" y="0" width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" />
      <text x="154" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">✓ Automated Payroll</text>

      <rect x="284" y="0" width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.12" />
      <text x="296" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">✓ Smart Analytics</text>
    </g>
  </g>
</svg>
